name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Deploy to Droplet
        run: |
          ssh -o StrictHostKeyChecking=no root@161.35.109.217 << 'EOF'
            git config --global --add safe.directory /var/www/boutique.tofenterprise.org
            cd /var/www/boutique.tofenterprise.org
            git fetch origin
            git reset --hard origin/main
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction

            # Asegurar permisos de escritura para el usuario de Apache (www-data)
            # sobre storage y bootstrap/cache. Sin esto, al compilar vistas nuevas
            # en runtime se produce "Permission denied" (HTTP 500).
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            sudo -u www-data php artisan cache:clear
            sudo -u www-data php artisan config:clear
            sudo -u www-data php artisan view:clear
            sudo -u www-data php artisan migrate --force

            # Generar los caches como www-data para que los archivos compilados
            # pertenezcan al usuario que atiende las peticiones HTTP.
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache

            sudo systemctl reload apache2
          EOF